<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Hardik Tyagi — Data Analyst and Developer</title>
  <desc id="desc">A futuristic dark blue and purple banner with abstract data lines and the words Build insight. Ship ideas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b1b"/><stop offset=".55" stop-color="#10163a"/><stop offset="1" stop-color="#22103e"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#586dff"/><stop offset=".5" stop-color="#8870ff"/><stop offset="1" stop-color="#d16cff"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#9672ff" stop-opacity=".48"/><stop offset="1" stop-color="#6a55ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9aa5ff" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <circle cx="950" cy="155" r="180" fill="url(#orb)" filter="url(#blur)"/>
  <path d="M0 255C180 210 220 280 390 227S620 200 760 150s260 12 440-90" fill="none" stroke="url(#glow)" stroke-width="2" stroke-opacity=".9"/>
  <path d="M0 285C160 248 260 305 405 267s252-17 374-63 235-5 421-68" fill="none" stroke="#a6a8ff" stroke-width="1" stroke-opacity=".33"/>
  <g fill="#c5baff"><circle cx="388" cy="227" r="4"/><circle cx="760" cy="150" r="4"/><circle cx="1000" cy="127" r="4"/></g>
  <g font-family="monospace" fill="#c9cbff" font-size="13" letter-spacing="3"><text x="76" y="78">PORTFOLIO / 2026</text><text x="935" y="280">DATA · CODE · CURIOSITY</text></g>
  <text x="72" y="164" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#f5f4ff">HARDIK TYAGI</text>
  <rect x="77" y="190" width="74" height="5" rx="2.5" fill="url(#glow)"/>
  <text x="77" y="232" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#c4c8ff">BUILD INSIGHT. SHIP IDEAS.</text>
  <g transform="translate(940 75)" fill="none" stroke="url(#glow)"><circle cx="85" cy="78" r="68" stroke-opacity=".55"/><ellipse cx="85" cy="78" rx="100" ry="37" transform="rotate(-27 85 78)" stroke-opacity=".8"/><ellipse cx="85" cy="78" rx="101" ry="36" transform="rotate(29 85 78)" stroke-opacity=".55"/><circle cx="85" cy="78" r="8" fill="#a98cff" stroke="none"/></g>
</svg>
